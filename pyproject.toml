[project]
name = "pii-anonymizer"
version = "0.1.0"
description = "用 Presidio 对 PII 做脱敏; 检测交给后台运行的 GLiNER2 服务 (/pii/extract)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "presidio-anonymizer>=2.2",
    "requests>=2.31",
]

[project.scripts]
pii-anon = "pii_anon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_anon"]
